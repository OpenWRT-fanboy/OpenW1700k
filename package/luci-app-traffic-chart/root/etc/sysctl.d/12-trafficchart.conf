# Conntrack byte/packet counters must exist from the very first packet of a flow. A flow created while accounting is
# off never gets counters, and its traffic can only show up as "Not attributed (N/C) - flows w/o counters" in the
# traffic chart (long-lived connections such as push/keep-alive on tcp/5228 stay that way for days).
# Applied early at boot, before the network comes up.
net.netfilter.nf_conntrack_acct=1
